<!DOCTYPE html>
<html>
<head>
<title>riptermIRC — RIP Viewer</title>
<meta charset="utf-8">
<style>
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { color: #00ff88; margin: 10px 0; font-size: 18px; }
  .subtitle { color: #888; font-size: 12px; margin-bottom: 15px; }
  #canvas-container {
    border: 2px solid #333;
    background: #000;
    margin: 10px 0;
  }
  canvas { display: block; image-rendering: pixelated; }
  .controls {
    display: flex; gap: 10px; align-items: center;
    margin: 10px 0; flex-wrap: wrap; justify-content: center;
  }
  button, input[type=file] {
    background: #2a2a4e; color: #00ff88; border: 1px solid #444;
    padding: 8px 16px; cursor: pointer; font-family: monospace;
  }
  button:hover { background: #3a3a6e; }
  #status { color: #888; font-size: 12px; margin: 5px 0; }
  #drop-zone {
    border: 2px dashed #444; padding: 40px; text-align: center;
    color: #666; margin: 10px 0; width: 636px;
  }
  #drop-zone.dragover { border-color: #00ff88; color: #00ff88; }
  .credits { color: #555; font-size: 10px; margin-top: 20px; }
</style>
</head>
<body>

<h1>riptermIRC — RIP Viewer</h1>
<div class="subtitle">Mystic BBS IRC Fork — Kiddo / GPLv3</div>

<div class="controls">
  <input type="file" id="fileInput" accept=".rip,.RIP">
  <button onclick="document.getElementById('fileInput').click()">Load .RIP File</button>
  <button onclick="clearCanvas()">Clear</button>
  <span id="status">Drop a .rip file or click Load</span>
</div>

<div id="drop-zone">Drop .rip file here</div>

<div id="canvas-container">
  <canvas id="ripCanvas" width="640" height="350"></canvas>
</div>

<div class="credits">
  Based on RIPtermJS by Carl Gorringe (GPLv3)<br>
  Forked by Kiddo — Mystic BBS IRC Fork — Ecstasy BBS FTN 1:152/158
</div>

<script>
// riptermIRC — Standalone RIP viewer
// Based on RIPtermJS by Carl Gorringe (GPLv3)
// Forked by Kiddo — Mystic BBS IRC Fork

const canvas = document.getElementById('ripCanvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

// EGA 16-color palette (CGA order, 171/87 values)
const CGA = [
  [0,0,0], [171,0,0], [0,171,0], [171,87,0],
  [0,0,171], [171,0,171], [0,171,171], [171,171,171],
  [87,87,87], [255,87,87], [87,255,87], [255,255,87],
  [87,87,255], [255,87,255], [87,255,255], [255,255,255]
];

let drawColor = 7;
let fillColor = 0;
let fillPattern = 1; // solid

// 8x8 CP437 font bitmap (embedded)
// Each char = 8 bytes, each byte = 1 scanline, MSB = left
const FONT_8x8 = new Uint8Array(2048); // Will be filled from canvas if needed

// For now, use canvas built-in text as fallback
// The real font would be loaded from 8x8.png

function megaVal(ch) {
  const c = ch.charCodeAt ? ch.charCodeAt(0) : ch;
  if (c >= 48 && c <= 57) return c - 48;        // 0-9
  if (c >= 65 && c <= 90) return c - 65 + 10;   // A-Z
  if (c >= 97 && c <= 122) return c - 97 + 10;  // a-z
  return 0;
}

function megaDecode(s, pos, width) {
  let val = 0;
  for (let i = 0; i < width && pos + i < s.length; i++) {
    val = val * 36 + megaVal(s[pos + i]);
  }
  return val;
}

function setPixel(x, y, colorIdx) {
  if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;
  const c = CGA[colorIdx & 0xF];
  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
  ctx.fillRect(x, y, 1, 1);
}

function drawBar(x1, y1, x2, y2, colorIdx) {
  if (x1 > x2) { let t = x1; x1 = x2; x2 = t; }
  if (y1 > y2) { let t = y1; y1 = y2; y2 = t; }
  const c = CGA[colorIdx & 0xF];
  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
  ctx.fillRect(x1, y1, x2 - x1 + 1, y2 - y1 + 1);
}

function drawText(x, y, text, colorIdx) {
  const c = CGA[colorIdx & 0xF];
  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
  // Use 8px monospace font for each character
  ctx.font = '8px monospace';
  ctx.textBaseline = 'top';
  
  for (let i = 0; i < text.length; i++) {
    const charCode = text[i]; // raw byte value
    // For CP437, render the character
    // Canvas can't render CP437 directly, so we draw a block for high bytes
    if (charCode >= 32 && charCode <= 126) {
      ctx.fillText(String.fromCharCode(charCode), x + i * 8, y);
    } else if (charCode >= 128) {
      // High CP437 — draw as colored block (approximation)
      // Real RIPterm would use the 8x8 font bitmap
      ctx.fillRect(x + i * 8, y, 8, 8);
    }
  }
}

function clearCanvas() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawColor = 7;
  fillColor = 0;
  fillPattern = 1;
  status.textContent = 'Canvas cleared';
}

function resizeCanvas(maxY) {
  if (maxY > canvas.height) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    canvas.height = maxY + 16;
    ctx.putImageData(imgData, 0, 0);
  }
}

function processRIP(data) {
  clearCanvas();
  
  let cmdCount = 0;
  let barCount = 0;
  let textCount = 0;
  
  // Join continuation lines
  let content = '';
  const lines = [];
  let buf = '';
  
  for (let i = 0; i < data.length; i++) {
    const b = data[i];
    if (b === 13) continue; // skip CR
    if (b === 10) { // LF
      if (buf.endsWith('\\')) {
        buf = buf.slice(0, -1); // remove backslash, join
      } else {
        lines.push(buf);
        buf = '';
      }
    } else {
      buf += String.fromCharCode(b);
    }
  }
  if (buf) lines.push(buf);
  
  for (const line of lines) {
    // Find all !| commands in this line
    let pos = 0;
    while (pos < line.length) {
      const idx = line.indexOf('!|', pos);
      if (idx < 0) break;
      
      const cmdStart = idx + 2;
      if (cmdStart >= line.length) break;
      
      const cmd = line.charCodeAt(cmdStart);
      
      // Find next !| or end of line
      let nextIdx = line.indexOf('!|', cmdStart + 1);
      const argStr = nextIdx >= 0 ? line.substring(cmdStart + 1, nextIdx) : line.substring(cmdStart + 1);
      const argBytes = [];
      for (let i = 0; i < argStr.length; i++) {
        argBytes.push(argStr.charCodeAt(i) & 0xFF);
      }
      
      cmdCount++;
      
      // Process command
      switch (String.fromCharCode(cmd)) {
        case '*': // Reset
          clearCanvas();
          break;
          
        case '1': // RIP level — ignore for now
          break;
          
        case 'Y': // Font style
          if (argStr.length >= 8) {
            // font, direction, charsize, reserved
            // We just note charsize for scaling
          }
          break;
          
        case 'c': // Set drawing color
          if (argStr.length >= 2) {
            drawColor = megaDecode(argStr, 0, 2) & 0xF;
          }
          break;
          
        case 'S': // Fill style
          if (argStr.length >= 4) {
            fillPattern = megaDecode(argStr, 0, 2);
            fillColor = megaDecode(argStr, 2, 2) & 0xF;
          }
          break;
          
        case 'B': // Filled bar
          if (argStr.length >= 8) {
            const x1 = megaDecode(argStr, 0, 2);
            const y1 = megaDecode(argStr, 2, 2);
            const x2 = megaDecode(argStr, 4, 2);
            const y2 = megaDecode(argStr, 6, 2);
            resizeCanvas(y2);
            drawBar(x1, y1, x2, y2, fillColor);
            barCount++;
          }
          break;
          
        case 'R': // Rectangle outline
          if (argStr.length >= 8) {
            const x1 = megaDecode(argStr, 0, 2);
            const y1 = megaDecode(argStr, 2, 2);
            const x2 = megaDecode(argStr, 4, 2);
            const y2 = megaDecode(argStr, 6, 2);
            const c = CGA[drawColor & 0xF];
            ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.lineWidth = 1;
            ctx.strokeRect(x1 + 0.5, y1 + 0.5, x2 - x1, y2 - y1);
          }
          break;
          
        case 'L': // Line
          if (argStr.length >= 8) {
            const x1 = megaDecode(argStr, 0, 2);
            const y1 = megaDecode(argStr, 2, 2);
            const x2 = megaDecode(argStr, 4, 2);
            const y2 = megaDecode(argStr, 6, 2);
            const c = CGA[drawColor & 0xF];
            ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x1 + 0.5, y1 + 0.5);
            ctx.lineTo(x2 + 0.5, y2 + 0.5);
            ctx.stroke();
          }
          break;
          
        case '@': // Text at position
          if (argStr.length >= 4) {
            const tx = megaDecode(argStr, 0, 2);
            const ty = megaDecode(argStr, 2, 2);
            // Rest is text (raw bytes)
            resizeCanvas(ty + 16);
            drawText(tx, ty, argBytes.slice(4), drawColor);
            textCount++;
          }
          break;
          
        case 'X': // Pixel
          if (argStr.length >= 4) {
            const px = megaDecode(argStr, 0, 2);
            const py = megaDecode(argStr, 2, 2);
            setPixel(px, py, drawColor);
          }
          break;
          
        case '#': // End of RIP
          break;
      }
      
      pos = nextIdx >= 0 ? nextIdx : line.length;
    }
  }
  
  status.textContent = `Rendered: ${cmdCount} commands, ${barCount} bars, ${textCount} text`;
}

// File input handler
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  status.textContent = `Loading ${file.name} (${file.size} bytes)...`;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    processRIP(data);
  };
  reader.readAsArrayBuffer(file);
});

// Drag and drop
const dropZone = document.getElementById('drop-zone');

dropZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', function(e) {
  dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  
  const file = e.dataTransfer.files[0];
  if (!file) return;
  
  status.textContent = `Loading ${file.name} (${file.size} bytes)...`;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    processRIP(data);
  };
  reader.readAsArrayBuffer(file);
});

// URL parameter loading
const urlParams = new URLSearchParams(window.location.search);
const fileParam = urlParams.get('file');
if (fileParam) {
  fetch(fileParam)
    .then(r => r.arrayBuffer())
    .then(buf => processRIP(new Uint8Array(buf)))
    .catch(err => { status.textContent = `Error loading ${fileParam}: ${err}`; });
}
</script>
</body>
</html>
